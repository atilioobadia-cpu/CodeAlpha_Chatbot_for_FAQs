name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q server.py

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Smoke-test FAQ API
        run: |
          python - <<'PY'
          from server import app

          client = app.test_client()
          health = client.get("/api/health")
          assert health.status_code == 200
          faq_response = client.get("/api/faqs")
          assert faq_response.status_code == 200
          assert health.get_json()["faq_count"] == len(faq_response.get_json())
          assert health.get_json()["faq_count"] > 0

          faqs = faq_response.get_json()
          suggested = [faq for faq in faqs if faq.get("suggested")]
          assert len(suggested) == 5
          for faq in faqs:
              exact = client.post("/api/ask", json={"question": faq["question"]})
              assert exact.status_code == 200
              assert exact.get_json()["matched"] is True
              assert exact.get_json()["question"] == faq["question"]

          paraphrases = {
              "Tell me about CodeAlpha": "What is CodeAlpha?",
              "What is task 2?": "What should the FAQ Chatbot do?",
              "How do I verify my certificate?": "How can I verify a CodeAlpha certificate?",
          }
          for question, expected in paraphrases.items():
              result = client.post("/api/ask", json={"question": question}).get_json()
              assert result["matched"] is True
              assert result["question"] == expected

          match = client.post("/api/ask", json={"question": "How many AI tasks should I complete?"})
          assert match.status_code == 200
          assert match.get_json()["matched"] is True
          assert "two or three" in match.get_json()["answer"]

          fallback = client.post("/api/ask", json={"question": "What is the weather in Nairobi?"})
          assert fallback.status_code == 200
          assert fallback.get_json()["matched"] is False
          PY


